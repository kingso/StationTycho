<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station Tycho</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05060a;
        --fg: #e8ecf4;
        --accent: #6ea8fe;
        --muted: #8b93a7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: radial-gradient(circle at 50% -20%, #121a33 0%, var(--bg) 60%);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
      }

      main {
        position: relative;
        width: min(960px, 92vw);
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(110, 168, 254, 0.25);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: absolute;
        inset: auto auto 0 0;
        padding: 16px 20px;
        width: 100%;
        background: linear-gradient(transparent, rgba(5, 6, 10, 0.85));
      }

      #hud h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #status {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      #status.ready {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="viewport" width="1280" height="720"></canvas>
      <div id="hud">
        <h1>Station Tycho</h1>
        <p id="status">Booting lunar engine&hellip;</p>
      </div>
    </main>

<script type="module">
      import init, {
        greet,
        ping_r2_asset,
        init_render_engine,
      } from "./pkg/station_tycho_engine.js";

      const status = document.getElementById("status");

      async function boot() {
        try {
          await init();
          const gpu = "gpu" in navigator;
          const r2Status = await ping_r2_asset("test_tile.ktx2");

          if (gpu) {
            const renderer = await init_render_engine("viewport");
            const base = `${greet("Operator")} WebGPU Engine Online. [R2 Edge: HTTP ${r2Status}]`;
            status.textContent = base;

            let frames = 0;
            let lastFpsUpdate = performance.now();
            const loop = (t) => {
              try {
                renderer.render(t);
              } catch (err) {
                status.textContent = `Render loop stopped: ${err}`;
                console.error(err);
                return;
              }
              frames++;
              if (t - lastFpsUpdate >= 1000) {
                status.textContent = `${base} — ${Math.round((frames * 1000) / (t - lastFpsUpdate))} FPS`;
                frames = 0;
                lastFpsUpdate = t;
              }
              requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
          } else {
            status.textContent = `${greet("Operator")} WebGPU unavailable — falling back. [R2 Edge: HTTP ${r2Status}]`;
          }
          status.classList.add("ready");
        } catch (err) {
          status.textContent = `Engine failed to load: ${err}`;
          console.error(err);
        }
      }

      boot();
    </script>
  </body>
</html>
