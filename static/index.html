<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station Tycho</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05060a;
        --fg: #e8ecf4;
        --accent: #6ea8fe;
        --muted: #8b93a7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: radial-gradient(circle at 50% -20%, #121a33 0%, var(--bg) 60%);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
      }

      main {
        position: relative;
        width: min(960px, 92vw);
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(110, 168, 254, 0.25);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }

      #hud {
        position: absolute;
        inset: auto auto 0 0;
        padding: 16px 20px;
        width: 100%;
        background: linear-gradient(transparent, rgba(5, 6, 10, 0.85));
        pointer-events: none;
      }

      #hud h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #status {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      #status.ready {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="viewport"></canvas>
      <div id="hud">
        <h1>Station Tycho</h1>
        <p id="status">Booting lunar engine&hellip;</p>
      </div>
    </main>

<script type="module">
      import init, {
        greet,
        init_render_engine,
        fetch_face_tile,
      } from "./pkg/station_tycho_engine.js";

      const status = document.getElementById("status");
      const canvas = document.getElementById("viewport");

      const UNSUPPORTED =
        "WebGPU is not available in this browser. Use a recent version of Chrome or Edge.";

      function observeCanvasSize(onSize) {
        const observer = new ResizeObserver(([entry]) => {
          const px = entry.devicePixelContentBoxSize?.[0];
          const dpr = window.devicePixelRatio || 1;
          const width = px ? px.inlineSize : Math.round(entry.contentBoxSize[0].inlineSize * dpr);
          const height = px ? px.blockSize : Math.round(entry.contentBoxSize[0].blockSize * dpr);
          onSize(width, height);
        });
        try {
          observer.observe(canvas, { box: "device-pixel-content-box" });
        } catch {
          observer.observe(canvas, { box: "content-box" });
        }
      }

      function formatAltitude(m) {
        return m >= 10000 ? `${(m / 1000).toFixed(1)} km` : `${m.toFixed(m < 10 ? 2 : 0)} m`;
      }

      const FACE_COUNT = 6;
      const DEBUG_WIREFRAME = 1;
      const DEBUG_HEIGHT = 2;

      async function loadFaceTiles(renderer) {
        const results = await Promise.allSettled(
          Array.from({ length: FACE_COUNT }, async (_, face) => renderer.upload_face_tile(await fetch_face_tile(face))),
        );
        for (const r of results) if (r.status === "rejected") console.error(r.reason);
        return results.filter((r) => r.status === "fulfilled").length;
      }

      // W toggles the wireframe, H toggles the height view.
      function attachDebugKeys(renderer) {
        let flags = 0;
        window.addEventListener("keydown", (e) => {
          const bit = { w: DEBUG_WIREFRAME, h: DEBUG_HEIGHT }[e.key.toLowerCase()];
          if (!bit || e.ctrlKey || e.metaKey || e.altKey) return;
          flags ^= bit;
          renderer.set_debug_flags(flags);
        });
      }

      // Left drag pans, right or Shift drag rotates/tilts, wheel or pinch zooms.
      function attachControls(renderer) {
        const pointers = new Map();
        const dpr = () => window.devicePixelRatio || 1;
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        canvas.addEventListener("pointerdown", (e) => {
          canvas.setPointerCapture(e.pointerId);
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        canvas.addEventListener("pointermove", (e) => {
          const prev = pointers.get(e.pointerId);
          if (!prev) return;
          const dx = (e.clientX - prev.x) * dpr();
          const dy = (e.clientY - prev.y) * dpr();
          if (pointers.size === 1) {
            if (e.buttons & 2 || e.shiftKey) renderer.rotate(dx, dy);
            else renderer.pan(dx, dy);
          } else if (pointers.size === 2) {
            const other = [...pointers].find(([id]) => id !== e.pointerId)[1];
            const before = Math.hypot(prev.x - other.x, prev.y - other.y);
            const after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
            if (before > 0 && after > 0) renderer.zoom(before / after);
            // Each finger contributes half of the midpoint movement.
            renderer.rotate(dx * 0.5, dy * 0.5);
          }
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        const release = (e) => pointers.delete(e.pointerId);
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);
        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const lines = e.deltaMode === 1 ? 40 : 1;
            renderer.zoom(Math.exp(e.deltaY * lines * 0.0015));
          },
          { passive: false },
        );
      }

      async function boot() {
        try {
          if (!("gpu" in navigator)) {
            status.textContent = UNSUPPORTED;
            return;
          }

          await init();

          const dpr = window.devicePixelRatio || 1;
          let renderer;
          try {
            renderer = await init_render_engine(
              "viewport",
              Math.round(canvas.clientWidth * dpr),
              Math.round(canvas.clientHeight * dpr),
            );
          } catch (err) {
            status.textContent = `${UNSUPPORTED} (${err})`;
            console.error(err);
            return;
          }
          observeCanvasSize((w, h) => renderer.resize(w, h));
          attachControls(renderer);
          attachDebugKeys(renderer);

          let tiles = "loading";
          const base = () => `${greet("Operator")} WebGPU Engine Online. [R2 tiles: ${tiles}]`;
          status.textContent = base();
          loadFaceTiles(renderer).then((loaded) => {
            tiles = `${loaded}/${FACE_COUNT}`;
          });

          let frames = 0;
          let lastFpsUpdate = performance.now();
          const loop = (t) => {
            try {
              renderer.render(t);
            } catch (err) {
              status.textContent = `Render loop stopped: ${err}`;
              console.error(err);
              return;
            }
            frames++;
            if (t - lastFpsUpdate >= 1000) {
              const lod = `Tiles ${renderer.visible_tile_count()} (L${renderer.finest_visible_level()}), cached ${renderer.cached_tile_count()}`;
              status.textContent = `${base()} — ${Math.round((frames * 1000) / (t - lastFpsUpdate))} FPS — Alt ${formatAltitude(renderer.altitude())} — ${lod}`;
              frames = 0;
              lastFpsUpdate = t;
            }
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
          status.classList.add("ready");
        } catch (err) {
          status.textContent = `Engine failed to load: ${err}`;
          console.error(err);
        }
      }

      boot();
    </script>
  </body>
</html>
