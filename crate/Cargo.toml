[package]
name = "station-tycho-engine"
version = "0.1.0"
edition = "2021"
description = "StationTycho Rust/WASM WebGPU rendering engine."
license = "MIT"
repository = "https://github.com/kingso/StationTycho"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
raw-window-handle = "0.6"
glam = "0.34"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "HtmlCanvasElement",
  "Navigator",
  "Response",
  "Gpu",
  "GpuCanvasContext"
]

[profile.release]
opt-level = "s"
lto = true
