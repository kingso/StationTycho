[package]
name = "station-tycho-engine"
version = "0.1.0"
edition = "2021"
description = "StationTycho Rust/WASM WebGPU rendering engine."
license = "MIT"
repository = "https://github.com/kingso/StationTycho"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Response",
  "Document",
  "HtmlCanvasElement"
]

[profile.release]
opt-level = "s"
lto = true
